# Does the port still build and link, on a runner with no cartridge?
#
# Two jobs, the same pair the port ran in the decomp repo (port-linkage.yml there):
#
# linkage  builds walk_window in PORT_LINK_ONLY mode and prints the linkage number.
#          port/tools/link_only.py stands a synthetic image in for the ROM: the length
#          the decomp's config gives, the real address at every relocation, zero
#          everywhere else. References come from relocations, so the link graph is the
#          real one. The exe it makes is dead (every table is zero, the archive mounts
#          read LINK-ONLY-BUILD-NOT-A-GAME) and is never uploaded.
# smoke    builds the ROM-free smoke targets with the plain configure.
#
# No Nintendo bytes reach GitHub: nothing here fetches, makes or uploads ROM data.
#
# The decomp comes in as the decomp/ submodule at the pinned commit, so both jobs check
# out with submodules.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  linkage:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pefile and capstone are what the post-link guards read walk_window.exe with
      # (facecycle_guard, pmf_guard, slot16_guard, dtor_dispatch_guard). A guard that
      # cannot import its reader refuses rather than passes.
      - name: Ninja and the guards' readers
        run: python -m pip install --disable-pip-version-check ninja pefile==2024.8.26 capstone==5.0.9

      - name: There is no cartridge here
        shell: bash
        run: |
          for d in extracted decomp/extracted; do
            if [ -e "$d" ]; then
              echo "$d exists on the runner: this workflow must not run against ROM data." >&2
              exit 1
            fi
          done

      # 32-bit MSVC: port/host_abi.h rejects a 64-bit host. vswhere finds VS, so no
      # version is pinned.
      - name: Configure (PORT_LINK_ONLY=ON)
        shell: cmd
        env:
          SM64DS_LINK_ONLY: "1"
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (echo ERROR: vswhere.exe not found 1>&2 & exit /b 1)
          set "VSINSTALL="
          for /f "usebackq delims=" %%I in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL (echo ERROR: no VS install with the x86 C++ tools 1>&2 & exit /b 1)
          >>"%GITHUB_ENV%" echo VSINSTALL=%VSINSTALL%
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat" >nul || exit /b 1
          cmake -S port -B build\port -G Ninja -DCMAKE_BUILD_TYPE=Release -DPORT_LINK_ONLY=ON -DBUILD_TESTING=OFF

      # The demangler, named before the build (the September fix). facegen reads every
      # decorated name through undname.exe. It used to look only under the VS 2022
      # folders, and the runner image ships a newer VS elsewhere, so every face row
      # refused nine minutes into the build. facegen now finds undname through vswhere
      # and the vcvars environment; this step prints which one it found, in the same
      # vcvars shell the build uses.
      - name: The demangler facegen binds with
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat" >nul || exit /b 1
          python port\tools\facegen.py --where-undname

      - name: Build and link walk_window
        shell: cmd
        env:
          SM64DS_LINK_ONLY: "1"
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat" >nul || exit /b 1
          cmake --build build\port --target walk_window

      - name: The artefact is a dead build
        shell: bash
        run: |
          test -f build/port/LINK_ONLY.stamp || { echo "no LINK_ONLY.stamp" >&2; exit 1; }
          grep -q "LINK-ONLY-BUILD-NOT-A-GAME" build/port/walk_window.exe || {
            echo "marker string absent from the exe" >&2; exit 1; }

      - name: Linkage
        shell: bash
        run: |
          python port/tools/linkage.py . | tee build/port/linkage.txt
          {
            echo '## Port linkage (cartridge-free)'
            echo '```'
            head -40 build/port/linkage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The map and the report, never the binary.
      - name: Upload map and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-linkage
          path: |
            build/port/walk_window.map
            build/port/linkage.txt
            build/port/LINK_ONLY.stamp
          if-no-files-found: warn

  smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ninja
        run: python -m pip install --disable-pip-version-check ninja

      - name: Configure
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (echo ERROR: vswhere.exe not found 1>&2 & exit /b 1)
          set "VSINSTALL="
          for /f "usebackq delims=" %%I in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL (echo ERROR: no VS install with the x86 C++ tools 1>&2 & exit /b 1)
          >>"%GITHUB_ENV%" echo VSINSTALL=%VSINSTALL%
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat" >nul || exit /b 1
          cmake -S port -B build\portsmoke -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: The demangler facegen binds with
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat" >nul || exit /b 1
          python port\tools\facegen.py --where-undname

      # smoke_fs is left out: its sources include the ROM data table, which needs the
      # cartridge. -k 0 so every target's link is reported.
      - name: Link the ROM-free targets
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat" >nul || exit /b 1
          cmake --build build\portsmoke --target smoke smoke_gx smoke_heap smoke_roots -- -k 0

      - name: No target here reads the cartridge
        shell: bash
        run: |
          python - <<'PY'
          import re, sys
          text = open("port/CMakeLists.txt", encoding="utf-8", errors="replace").read()
          bad = []
          for target in ("smoke", "smoke_gx", "smoke_heap", "smoke_roots"):
              m = re.search(r"add_executable\(" + target + r"\b(.*?)\)", text, re.S)
              if not m:
                  bad.append(target + ": no add_executable found")
              elif "ROMDATA_C" in m.group(1):
                  bad.append(target + ": source list carries ROMDATA_C")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("four targets, none of them reads the cartridge")
          PY
